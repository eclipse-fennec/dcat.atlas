name: CI Build

# Build-only on every branch EXCEPT main and snapshot: those publish the container
# image via their dedicated workflows (release.yml / snapshot.yml), which run the
# same reusable verify first and gate the image push on it. Nothing is deployed to
# Maven Central from this workspace — the publishing workflows exist for the
# container image only.
on:
  push:
    branches-ignore:
      - main
      - snapshot
  pull_request:
    branches:
      - '*'

# Least privilege by default; this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@227b1dfa5f323fdd6d857d0a61fbaaf6e7288716 # v1.0.0
