name: CI Build

# Build-only on every branch EXCEPT main and snapshot: those publish to Maven and
# push the container image via their dedicated workflows (release.yml /
# snapshot.yml), which run this same reusable verify first and gate the publish on
# it. Feature branches and PRs only verify — they publish nothing.
on:
  push:
    branches-ignore:
      - main
      - snapshot
  pull_request:
    branches:
      - '*'

# Least privilege by default; this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
