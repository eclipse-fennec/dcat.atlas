name: License Check (IP Dash)

# Manual-only for now. No dependency of this workspace has been through Eclipse IP
# review yet, so with the current baseline the check is structurally red and would
# only add noise on every push and PR. Run it via workflow_dispatch when preparing
# a release, and switch on the push/pull_request triggers once the restricted
# dependencies have been vetted.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dash:
    name: Eclipse Dash license check
    runs-on: ubuntu-latest
    # TODO: remove once the restricted dependencies have passed IP review
    # (tools/dash-licenses.sh --review --project technology.fennec).
    # Until then the check runs informationally and must not fail the build.
    continue-on-error: true
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21
      - name: Generate DEPENDENCIES and check licenses
        # Exits non-zero (number of "restricted" artifacts) when any dependency
        # has not been vetted yet, which fails the job. Regenerate and review
        # locally with: tools/dash-licenses.sh [--review]
        run: bash tools/dash-licenses.sh
      - name: Upload DEPENDENCIES
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEPENDENCIES
          path: DEPENDENCIES
          if-no-files-found: warn
