name: Docs site

# Build the VitePress documentation site (curated user guide) and publish it to
# GitHub Pages under /<version>/. Unlike emf.m2x — which merges several Pages
# slices (p2 update site + docs) in an orchestrator — DCAT.Atlas has only the
# docs, so this single workflow builds and deploys in one go. A root index.html
# redirect makes https://eclipse-fennec.github.io/dcat.atlas/ land on the docs.
# Triggered from `snapshot`, the default branch and where development lands —
# matching the other Fennec repos, which deploy their docs from `snapshot` too.
# `main` currently holds only the initial commit, so triggering on it meant this
# workflow never ran and the published site 404'd. Add `main` here once releases
# start landing there, alongside a `latest` version segment.
on:
  push:
    branches:
      - snapshot
  workflow_dispatch:

# Serialize Pages publishing; let an in-flight deploy finish before the next.
concurrency:
  group: docs-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Version/URL segment, matching the org convention
# (https://eclipse-fennec.github.io/<repo>/<version>/). Development docs publish
# under `snapshot`; add `latest` and tagged versions once the first release lands.
env:
  DOCS_BRANCH: snapshot

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated git timestamps
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci
      - name: Build with VitePress
        working-directory: docs-site
        run: npm run docs:build
      - name: Assemble site
        run: |
          set -euo pipefail
          branch="${DOCS_BRANCH}"
          out="site"
          rm -rf "$out"
          mkdir -p "$out/${branch}"
          cp -r docs-site/docs/.vitepress/dist/. "$out/${branch}/"
          # Root redirect so https://eclipse-fennec.github.io/dcat.atlas/ lands on
          # the current docs version. Replaced by a real version picker once
          # `latest` (= main) is published.
          cat > "$out/index.html" <<HTML
          <!doctype html><meta charset="utf-8">
          <title>Fennec DCAT.Atlas</title>
          <meta http-equiv="refresh" content="0; url=./${branch}/">
          <link rel="canonical" href="./${branch}/">
          <p>Redirecting to <a href="./${branch}/">the Fennec DCAT.Atlas documentation</a>&hellip;</p>
          HTML
          # Disable Jekyll so paths like /.vitepress assets are served verbatim.
          touch "$out/.nojekyll"
          echo "site:"; find "$out" -maxdepth 2 -type d | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # OIDC token for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
