name: Release Build

# Verified push to `main` releases the bundles to Maven Central AND publishes the
# container image under the moving `latest` tag (plus the immutable bundle
# version). Same shape as snapshot.yml, with do-release: true.
#
# `main` currently trails `snapshot`, so this workflow stays dormant until the
# first release lands there.
on:
  push:
    branches:
      - main

# Workflow-level ceiling for the called reusables. The credential-scoped release
# and container jobs get their secrets via `secrets: inherit` below (verify never
# sees them); packages: write is needed for the GHCR image push.
permissions:
  contents: read
  packages: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2

  release:
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
    with:
      # Central release: releng/release.bnd instead of snapshot.bnd, and the
      # Sonatype plugin switches to autopublish.
      do-release: true
      # bnd resolve/export tasks are not parallel-safe in this workspace.
      gradle-parallel: false
      # Export the docker runtime jar in the SAME build that publishes to Maven,
      # and hand it to the container job as the release-jars artifact.
      extra-gradle-tasks: >-
        org.eclipse.fennec.dcat.atlas.runtime:export.docker
      # docker.jar is what the image runs; the api jar travels along only so the
      # container job can read its Bundle-Version for the immutable image tag.
      artifact-paths: |
        org.eclipse.fennec.dcat.atlas.runtime/generated/distributions/executable/docker.jar
        org.eclipse.fennec.dcat.atlas.api/generated/org.eclipse.fennec.dcat.atlas.api.jar
    secrets: inherit

  # The image is built from the release-jars artifact of the release job above,
  # so the jar it embeds is the jar published to Maven in that same Gradle
  # invocation. prepareDocker stages docker/dcatatlas/content itself, which the
  # central workflow supports as prepare-command (eclipse-fennec/.github,
  # docs/ci-cd-reusable-workflows.md §5.7).
  container:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-container.yml@074409595cdb7f4afc3c3ab521fe720b05f913b3 # eclipse-fennec/.github#43
    with:
      image-name: dcat.atlas
      docker-label: latest
      docker-context: docker/dcatatlas
      prepare-command: ./gradlew --no-daemon :docker:dcatatlas:prepareDocker
      # docker.jar is what the image runs; the api jar travels along only so its
      # Bundle-Version can become the immutable image tag.
      version-jar: org.eclipse.fennec.dcat.atlas.api.jar
    secrets: inherit
