name: Reusable Container Deploy

# Repo-local reusable: builds/pushes the DCAT.Atlas runtime image to Docker Hub
# and GHCR. The moving tag label (snapshot vs latest) comes from the calling
# workflow.
#
# One deviation from event.atlas and model.atlas: this job BUILDS the runtime jar
# itself instead of downloading the "release-jars" artifact uploaded by
# reusable-release. This workspace publishes nothing to Maven, so there is no
# release job to piggyback on. Everything else — the bnd CLI version read, the
# two-registry push, the moving/immutable tag pair, the pinned actions — is the
# same as those two repos.
on:
  workflow_call:
    inputs:
      docker-label:
        description: 'Moving docker tag label, e.g. snapshot or latest.'
        type: string
        required: true
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_API_TOKEN:
        required: true

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8
  # bnd resolve/export tasks are not parallel-safe in this workspace.
  GRADLE_OPTS: >-
    -Dorg.gradle.parallel=false

defaults:
  run:
    shell: bash

jobs:
  container:
    name: Container Deploy (${{ inputs.docker-label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          cache: gradle
          java-version: 21
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      # Export and stage are two separate invocations by design: the bnd workspace
      # settings plugin only includes the bnd projects the requested task paths
      # need, so a :docker:dcatatlas:prepareDocker in the same command line would
      # configure a graph of just [cnf, docker] (see docker/dcatatlas/build.gradle).
      - name: Export the runtime jar
        run: ./gradlew --no-daemon :org.eclipse.fennec.dcat.atlas.runtime:export.docker
      - name: Install bnd
        run: |
          curl -Lk -o /tmp/biz.aQute.bnd.jar \
            https://repo1.maven.org/maven2/biz/aQute/bnd/biz.aQute.bnd/7.2.1/biz.aQute.bnd-7.2.1.jar
      - name: Extract Bundle Version
        id: bundle_version
        run: |
          VERSION=$(java -jar /tmp/biz.aQute.bnd.jar select -h Bundle-Version \
            org.eclipse.fennec.dcat.atlas.api/generated/org.eclipse.fennec.dcat.atlas.api.jar \
            2>/dev/null | head -1)
          echo "VERSION=${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Prepare Docker content
        run: |
          ./gradlew --no-daemon :docker:dcatatlas:prepareDocker
          ls -lR docker/dcatatlas/content
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Login to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_TOKEN }}
      - name: Login to Github Docker Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: docker/dcatatlas/
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |-
            docker.io/eclipsefennec/dcat.atlas:${{ inputs.docker-label }}
            docker.io/eclipsefennec/dcat.atlas:${{ steps.bundle_version.outputs.version }}
            ghcr.io/eclipse-fennec/dcat.atlas:${{ inputs.docker-label }}
            ghcr.io/eclipse-fennec/dcat.atlas:${{ steps.bundle_version.outputs.version }}
