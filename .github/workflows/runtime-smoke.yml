# Generated with the assistance of AI (Anthropic Claude); reviewed by a project
# committer before merge.
name: Runtime Smoke Test

# Builds the container image exactly as snapshot.yml/release.yml would ship it, starts
# it, and checks that it answers (#78). reusable-verify.yml runs the unit and OSGi
# tests, but nothing else ever starts the shipped runtime: a change to docker.bndrun /
# base.bndrun could leave the image unable to start and CI would still be green.
#
# Runs on every push (snapshot included, so the check exists on the default branch)
# and on every PR. It pushes nothing and logs in nowhere.
#
# Everything repo-specific is in the `env:` block below, so the job can move into
# eclipse-fennec/.github as a reusable workflow by turning those values into
# workflow_call inputs. The DCAT.Atlas API round trip lives in
# .github/runtime-smoke/check.sh and stays with the repository.
on:
  push:
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

concurrency:
  group: runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LC_ALL: en_US.UTF-8
  # bnd resolve/export tasks are not parallel-safe in this workspace.
  GRADLE_OPTS: -Dorg.gradle.parallel=false
  # Gradle tasks that export the runtime jar, then stage it as the Docker build context.
  # Two invocations on purpose, see docker/dcatatlas/build.gradle.
  EXPORT_TASKS: ':org.eclipse.fennec.dcat.atlas.runtime:export.docker'
  PREPARE_TASKS: ':docker:dcatatlas:prepareDocker'
  DOCKER_CONTEXT: docker/dcatatlas
  IMAGE: dcat.atlas:runtime-smoke
  CONTAINER_NAME: runtime-smoke
  CONTAINER_PORT: '8080'
  HOST_PORT: '8080'
  # One `docker run` argument per line; ${GITHUB_WORKSPACE} is expanded.
  # Shapes: a minimal test shape, because the readiness check stays CRITICAL while the
  # configured shapes directory is empty (the real shapes are AGPL and not shipped).
  # Store: a named volume, seeded by Docker from the bare repository in the image.
  DOCKER_RUN_ARGS: |
    --env=PUBLIC_BASE_URL=http://localhost:8080/rest/
    --volume=runtime-smoke-store:/opt/dcat/store.git
    --volume=${GITHUB_WORKSPACE}/.github/runtime-smoke/shapes:/opt/dcat/shapes:ro
  READY_PATH: /health/ready
  READY_TIMEOUT_SECONDS: '180'
  # Plain GETs: "<path> <expected status> [<Content-Type prefix>]", one per line.
  SMOKE_ENDPOINTS: |
    /health/live 200 application/json
    /health/ready 200 application/json
  # Repo-specific functional checks, called with the base URL.
  CHECK_SCRIPT: .github/runtime-smoke/check.sh
  # Lines in the container log that fail the job even when every request passed.
  LOG_ERROR_PATTERN: '(^|[^A-Za-z])(ERROR|SEVERE)([^A-Za-z]|$)|Unresolved requirement|Failed to start bundle|Could not resolve'

jobs:
  smoke:
    name: Runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          cache: gradle
          java-version: 21
      - name: Export the runtime
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon $EXPORT_TASKS
      - name: Stage the Docker build context
        run: ./gradlew --no-daemon $PREPARE_TASKS
      - name: Build the image (no push)
        run: docker build --tag "$IMAGE" "$DOCKER_CONTEXT"
      - name: Start the container
        run: |
          run_args="${DOCKER_RUN_ARGS//'${GITHUB_WORKSPACE}'/$GITHUB_WORKSPACE}"
          mapfile -t args < <(sed '/^[[:space:]]*$/d' <<<"$run_args")
          docker run --detach --name "$CONTAINER_NAME" \
            --publish "127.0.0.1:${HOST_PORT}:${CONTAINER_PORT}" "${args[@]}" "$IMAGE"
      - name: Wait for readiness
        run: |
          url="http://localhost:${HOST_PORT}${READY_PATH}"
          deadline=$((SECONDS + READY_TIMEOUT_SECONDS))
          status=000
          while ((SECONDS < deadline)); do
            if [[ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" != true ]]; then
              echo "::error::The container exited before it became ready"
              exit 1
            fi
            status="$(curl -s -o /tmp/ready.json -w '%{http_code}' "$url" || true)"
            [[ "$status" == 200 ]] && break
            sleep 3
          done
          cat /tmp/ready.json 2>/dev/null || true
          echo
          if [[ "$status" != 200 ]]; then
            echo "::error::$url answered $status, not 200, within ${READY_TIMEOUT_SECONDS}s"
            exit 1
          fi
          echo "Ready after $((SECONDS))s"
      - name: Check endpoints
        run: |
          failures=0
          while read -r path want_status want_type; do
            [[ -z "$path" ]] && continue
            out="$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "http://localhost:${HOST_PORT}${path}" || true)"
            status="${out%% *}"; type="${out#* }"
            if [[ "$status" != "$want_status" || ( -n "$want_type" && "$type" != "$want_type"* ) ]]; then
              echo "::error::GET $path -> $status $type, expected $want_status ${want_type}"
              failures=$((failures + 1))
            else
              echo "PASS  GET $path -> $status $type"
            fi
          done <<<"$SMOKE_ENDPOINTS"
          ((failures == 0))
      - name: Functional checks
        run: bash "$CHECK_SCRIPT" "http://localhost:${HOST_PORT}"
      - name: Container log
        if: always()
        run: |
          docker logs "$CONTAINER_NAME" > runtime-smoke.log 2>&1 || true
          cat runtime-smoke.log
      - name: Scan the container log for errors
        run: |
          if grep -nE "$LOG_ERROR_PATTERN" runtime-smoke.log; then
            echo "::error::The runtime logged errors (lines above)"
            exit 1
          fi
          echo "No errors in the container log"
      - name: Upload the container log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-smoke-log
          path: runtime-smoke.log
          if-no-files-found: ignore
      - name: Stop the container
        if: always()
        run: docker rm --force "$CONTAINER_NAME" || true
