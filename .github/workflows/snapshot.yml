name: Snapshot Build

# Verified push to `snapshot` — the development branch — publishes the container
# image under the moving `snapshot` tag (plus the immutable bundle version).
# Nothing is published to Maven from this workspace, so unlike the other Fennec
# repos there is no release job between verify and container.
# The docs site is deployed by its own workflow (docs-pages.yml), also from
# `snapshot`.
on:
  push:
    branches:
      - snapshot
  # Manual re-publish of the snapshot image without a new commit.
  workflow_dispatch:

# Workflow-level ceiling for the called reusables. The container job gets the
# Docker Hub credentials via `secrets: inherit` below (verify never sees them);
# packages: write is needed for the GHCR image push.
permissions:
  contents: read
  packages: write

concurrency:
  group: snapshot-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@227b1dfa5f323fdd6d857d0a61fbaaf6e7288716 # v1.0.0

  container:
    needs: verify
    uses: ./.github/workflows/reusable-container.yml
    with:
      docker-label: snapshot
    secrets: inherit
