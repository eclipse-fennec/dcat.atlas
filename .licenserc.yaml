header:
  license:
    spdx-id: EPL-2.0
    copyright-owner: Contributors to the Eclipse Foundation
    content: |
      Copyright (c) 2012 - 2026 Data In Motion and others.
      All rights reserved.

      This program and the accompanying materials are made
      available under the terms of the Eclipse Public License 2.0
      which is available at https://www.eclipse.org/legal/epl-2.0/

      SPDX-License-Identifier: EPL-2.0

      Contributors:
          Data In Motion - initial API and implementation

    # Only these four lines are matched, so the copyright line above may vary
    # between files (e.g. EMF-generated code carrying the genmodel's copyrightText).
    pattern: |
      This program and the accompanying materials are made
      available under the terms of the Eclipse Public License 2.0
      which is available at https://www.eclipse.org/legal/epl-2.0/
      SPDX-License-Identifier: EPL-2.0
  paths-ignore:
    # NOTE: EMF-generated sources are deliberately *not* exempt. Both genmodels
    # (dcatap.genmodel, shacl.genmodel) set `copyrightText` on the GenModel root,
    # so the generator emits the EPL-2.0 header and it survives regeneration.
    - 'dist'
    - 'licenses'
    - '**/package-info.java'
    - '**/packageinfo'
    - '**/module-info.java'
    - '**/*.bnd'
    - '**/*.bndrun'
    - '**/*.xml'
    - '**/*.csv'
    - '**/*.json'
    - '**/*.ecore'
    - '**/*.xcore'
    - '**/*.genmodel'
    # RDF sample and test data (DCAT-AP.de reference documents, SHACL shapes).
    - '**/*.rdf'
    - '**/*.ttl'
    - '**/*.nt'
    - '**/*.n3'
    - '**/*.jsonld'
    - '**/*.xsd_'
    - '**/*.md'
    - '**/*.MD'
    - '**/.keep'
    - '**/*.jetproperties'
    - '**/*.javajet'
    - '**/*.javajetinc'
    - '**/*.properties'
    - '**/*.maven'
    - '**/*.mvn'
    - '**/*.MF'
    - '**/*.html'
    - '**/*.png'
    - '**/*.jar'
    - '**/*.drawio*'
    - '**/*.ftl'
    - '**/*.aird'
    - '**/*.basic'
    - '**/.classpath'
    - 'LICENSE'
    - 'DEPENDENCIES'
    - 'Jenkinsfile'
    - 'NOTICE'
    - 'cnf/**'
    - 'docs/**'
    - 'docs-site/**'
    # Local scratch clones of other projects' code; gitignored, so absent in CI.
    - 'references/**'
    - '**/generated/**'
    - '.gitattributes'
    - '.github/**'
    - '**/.gitignore'
    - 'cnf/release/**.*'
    - '.gradle-wrapper/gradle-wrapper.properties'
    - '.licenserc.yaml'
    - '**/.project'
    - '**/*.prefs'
    - 'build.gradle'
    - 'gradle.properties'
    - 'gradlew'
    - 'gradlew.bat'
    - 'settings.gradle'
    - 'old/**'

  comment: always
