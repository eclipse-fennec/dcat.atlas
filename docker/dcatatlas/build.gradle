/*
 * Stages the exported runtime jar into content/ so the Dockerfile has a build
 * context. Mirrors the docker/* projects in model.atlas.
 *
 * Deliberately NOT wired to :org.eclipse.fennec.dcat.atlas.runtime:export.docker.
 * The bnd workspace *settings* plugin only includes the bnd projects it believes
 * the requested task paths need, so invoking :docker:dcatatlas:prepareDocker
 * directly yields a project graph of just [cnf, docker] — any dependsOn or
 * evaluationDependsOn on the runtime project fails at configuration time with
 * "Project with path ... could not be found". Export and stage stay two commands:
 *
 *   ./gradlew :org.eclipse.fennec.dcat.atlas.runtime:export.docker
 *   ./gradlew :docker:dcatatlas:prepareDocker
 */

task prepareDocker() {
	def stageDir = file('content')
	def exported = file('../../org.eclipse.fennec.dcat.atlas.runtime/generated/distributions/executable/docker.jar')

	doFirst {
		stageDir.deleteDir()
	}
	doLast {
		if (!exported.exists()) {
			throw new GradleException("Expected the exported runtime at ${exported}. Run ':org.eclipse.fennec.dcat.atlas.runtime:export.docker' first.")
		}
		stageDir.mkdirs()
		copy {
			from exported
			into stageDir
		}
		println "Staged ${exported.name} into ${stageDir}"
	}
}
