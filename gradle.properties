bnd_version=7.2.1
bnd_snapshots=https://bndtools.jfrog.io/bndtools/libs-snapshot-local

# The bnd workspace plugin sweeps all root folders (except dot-folders, buildSrc, gradle)
# into the project graph. Anything swept gets the java plugin and produces an empty jar under
# <folder>/build/libs/, so list every root folder that holds no bundle:
#   build      the Gradle output dir itself
#   docker     container packaging (the :docker:dcatatlas staging project is included explicitly
#              in settings.gradle, so :docker still exists — this only keeps bnd off it)
#   docs, docs-site, tools, references   content only; docs-site is built with npm, not Gradle
# 'cnf' is deliberately absent: it is the bnd workspace configuration project and must stay.
bnd_exclude=build,docker,docs,docs-site,tools,references

# --- Project coordinates (single source of truth) ---
# Used by Gradle directly and imported into bnd via `-include` in cnf/ext/fennec.bnd.
# Adjust these per project (see cnf/SETUP.MD). The Maven group id must start with org.eclipse.fennec.
github_org=eclipse-fennec
github_repository=dcat.atlas
maven_group_id=org.eclipse.fennec.dcat
